<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
    transition:.3s;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

/* Header */
.header{
    height:65px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 18px;
    background:linear-gradient(135deg,#1769ff,#438cff);
    color:#fff;
}

.header h2{
    font-size:20px;
}

.back-btn{
    border:0;
    background:transparent;
    color:#fff;
    font-size:34px;
    cursor:pointer;
}

/* Settings */
.settings{
    padding:20px 16px;
}

.setting-section{
    margin-bottom:25px;
}

.setting-section h3{
    font-size:13px;
    color:#7d8798;
    margin-bottom:8px;
    text-transform:uppercase;
}

.setting-item{
    min-height:68px;
    padding:13px 15px;
    border-radius:14px;
    background:#f7f9fc;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    margin-bottom:8px;
    transition:.2s;
}

.setting-item:active{
    transform:scale(.98);
}

.setting-item strong{
    display:block;
    font-size:15px;
    margin-bottom:5px;
}

.setting-item small{
    color:#7b8494;
    font-size:12px;
}

.arrow{
    font-size:27px;
    color:#8b94a3;
}

/* Switch */
.switch{
    width:48px;
    height:26px;
    border-radius:20px;
    background:#c8ced8;
    padding:3px;
    transition:.25s;
}

.switch-dot{
    width:20px;
    height:20px;
    background:#fff;
    border-radius:50%;
    transition:.25s;
}

.switch.active{
    background:#18a957;
}

.switch.active .switch-dot{
    transform:translateX(22px);
}

/* Language */
select{
    border:0;
    background:transparent;
    font-size:14px;
    font-weight:600;
    color:#1769ff;
    outline:none;
}

.logout strong{
    color:#e53935;
}

/* Modal */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:480px;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:22px 22px 0 0;
    padding:20px 16px 30px;
    animation:slideUp .25s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:20px;
}

.modal-header button{
    border:0;
    background:#f1f3f6;
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
}

.period{
    margin-top:5px;
    font-size:12px;
    color:#818a98;
}

/* Summary */
.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.summary-card{
    background:#f7f9fc;
    border-radius:14px;
    padding:14px;
}

.summary-card span{
    display:block;
    font-size:12px;
    color:#7d8798;
}

.summary-card strong{
    display:block;
    font-size:20px;
    margin:6px 0;
}

.summary-card small{
    font-size:11px;
}

/* Chart */
.chart-box{
    margin-top:15px;
    padding:15px;
    border-radius:16px;
    background:#f8fafc;
}

.chart-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.chart-title strong{
    font-size:14px;
}

.chart-title span{
    font-size:12px;
    font-weight:bold;
}

canvas{
    width:100%;
    height:150px;
}

/* History */
.history-list{
    margin-top:20px;
}

.history-list h3{
    font-size:15px;
    margin-bottom:10px;
}

.history-row{
    display:flex;
    justify-content:space-between;
    padding:12px 4px;
    border-bottom:1px solid #edf0f4;
}

.history-row span{
    font-size:12px;
}

.history-row strong{
    font-size:12px;
}

/* Dark Theme */
body.dark{
    background:#10141b;
    color:#f1f4f8;
}

body.dark .app{
    background:#10141b;
}

body.dark .setting-item,
body.dark .summary-card,
body.dark .chart-box{
    background:#191f29;
}

body.dark .modal-content{
    background:#10141b;
}

body.dark .history-row{
    border-color:#29313d;
}

body.dark .modal-header button{
    background:#202733;
    color:#fff;
}

body.dark select{
    color:#67a1ff;
}
</style>
</head>


<body>

<div class="app">

    <!-- Header -->
    <header class="header">
        <button class="back-btn" onclick="goBack()">‹</button>
        <h2>Settings</h2>
    </header>


    <!-- Settings -->
    <main class="settings">

        <!-- Appearance -->
        <section class="setting-section">

            <h3>Appearance</h3>

            <div class="setting-item" onclick="toggleTheme">

                <div>
                    <strong>Theme</strong>
                    <small id="themeText">Light</small>
                </div>

                <div class="switch" id="themeSwitch">
                    <div class="switch-dot"></div>
                </div>

            </div>

        </section>


        <!-- Sales -->
        <section class="setting-section">

            <h3>Sales</h3>

            <div class="setting-item"
                 onclick="openSalesHistory()">

                <div>
                    <strong>Sales History</strong>
                    <small>Last 30 days</small>
                </div>

                <span class="arrow">›</span>

            </div>

        </section>


        <!-- Sound -->
        <section class="setting-section">

            <h3>Sound</h3>

            <div class="setting-item"
                 onclick="toggleSound()">

                <div>
                    <strong>Sound</strong>
                    <small id="soundText">On</small>
                </div>

                <div class="switch active"
                     id="soundSwitch">

                    <div class="switch-dot"></div>

                </div>

            </div>

        </section>


        <!-- Language -->
        <section class="setting-section">

            <h3>Language</h3>

            <div class="setting-item">

                <div>
                    <strong>Language</strong>
                    <small id="languageText">বাংলা</small>
                </div>

                <select id="languageSelect"
                        onchange="changeLanguage(this.value)">

                    <option value="bn">বাংলা</option>
                    <option value="en">English</option>

                </select>

            </div>

        </section>


        <!-- App -->
        <section class="setting-section">

            <h3>App</h3>

            <div class="setting-item"
                 onclick="showAppInfo()">

                <div>
                    <strong>App Info</strong>
                    <small>Version 1.0.0</small>
                </div>

                <span class="arrow">›</span>

            </div>


            <div class="setting-item logout"
                 onclick="logout()">

                <div>
                    <strong>Logout</strong>
                    <small>Sign out from this account</small>
                </div>

                <span class="arrow">›</span>

            </div>

        </section>

    </main>


    <!-- Sales History -->
    <div class="modal" id="salesModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Sales History</h2>

                <button onclick="closeSalesHistory()">
                    ×
                </button>

            </div>

            <p class="period">
                Last 30 Days
            </p>


            <!-- Summary -->
            <div class="summary">

                <div class="summary-card">

                    <span>Total Sales</span>

                    <strong id="totalSales">
                        ৳0
                    </strong>

                    <small id="salesTrend">
                        —
                    </small>

                </div>


                <div class="summary-card">

                    <span>Total Due</span>

                    <strong id="totalDue">
                        ৳0
                    </strong>

                    <small id="dueTrend">
                        —
                    </small>

                </div>

            </div>


            <!-- Sales Graph -->
            <div class="chart-box">

                <div class="chart-title">

                    <strong>
                        Sales Trend
                    </strong>

                    <span id="salesDirection"></span>

                </div>

                <canvas id="salesChart"></canvas>

            </div>


            <!-- Due Graph -->
            <div class="chart-box">

                <div class="chart-title">

                    <strong>
                        Due Trend
                    </strong>

                    <span id="dueDirection"></span>

                </div>

                <canvas id="dueChart"></canvas>

            </div>


            <!-- 30 Days History -->
            <div class="history-list">

                <h3>Last 30 Days</h3>

                <div id="historyData"></div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   THEME
========================= */

let darkMode =
    localStorage.getItem("darkMode") === "true";


function applyTheme(){

    document.body.classList.toggle(
        "dark",
        darkMode
    );

    document.getElementById(
        "themeText"
    ).textContent =
        darkMode ? "Dark" : "Light";

    document.getElementById(
        "themeSwitch"
    ).classList.toggle(
        "active",
        darkMode
    );
}


function toggleTheme(){

    darkMode = !darkMode;

    localStorage.setItem(
        "darkMode",
        darkMode
    );

    applyTheme();

}


/* =========================
   SOUND
========================= */

let sound =
    localStorage.getItem("sound") !== "false";


function applySound(){

    document.getElementById(
        "soundText"
    ).textContent =
        sound ? "On" : "Off";

    document.getElementById(
        "soundSwitch"
    ).classList.toggle(
        "active",
        sound
    );

}


function toggleSound(){

    sound = !sound;

    localStorage.setItem(
        "sound",
        sound
    );

    applySound();

}


/* =========================
   LANGUAGE
========================= */

function changeLanguage(language){

    localStorage.setItem(
        "language",
        language
    );

    document.getElementById(
        "languageText"
    ).textContent =
        language === "bn"
        ? "বাংলা"
        : "English";

}


/* =========================
   BACK
========================= */

function goBack(){

    if(history.length > 1){
        history.back();
    }

}


/* =========================
   30 DAYS DATA
========================= */

/*
   এগুলো এখন Demo Data।
   পরে তোমার আসল Sales/Due
   ডাটার সাথে connect করা যাবে।
*/

const salesData = [

    12000,
    14500,
    11000,
    15500,
    16800,
    17500,
    16200,
    19000,
    21000,
    18500,
    22000,
    23500,
    21800,
    24000,
    25000,
    23500,
    26000,
    27500,
    26800,
    29000,
    30000,
    28500,
    31000,
    32500,
    34000,
    32000,
    35000,
    36500,
    38000,
    39500

];


const dueData = [

    5000,
    5200,
    4900,
    5500,
    6000,
    6200,
    5800,
    6400,
    6800,
    6500,
    7200,
    7500,
    7000,
    7800,
    8200,
    7900,
    8500,
    8800,
    9100,
    8900,
    9500,
    9800,
    9400,
    10200,
    10800,
    10500,
    11000,
    11500,
    11200,
    12000

];


/* =========================
   OPEN SALES HISTORY
========================= */

function openSalesHistory(){

    document.getElementById(
        "salesModal"
    ).classList.add("show");

    calculateSummary();

    drawChart(
        "salesChart",
        salesData,
        "sales"
    );

    drawChart(
        "dueChart",
        dueData,
        "due"
    );

    createHistory();

}


/* CLOSE */

function closeSalesHistory(){

    document.getElementById(
        "salesModal"
    ).classList.remove("show");

}


/* =========================
   SUMMARY
========================= */

function calculateSummary(){

    const totalSales =
        salesData.reduce(
            (a,b) => a+b,
            0
        );

    const totalDue =
        dueData.reduce(
            (a,b) => a+b,
            0
        );


    document.getElementById(
        "totalSales"
    ).textContent =
        "৳" +
        totalSales.toLocaleString();


    document.getElementById(
        "totalDue"
    ).textContent =
        "৳" +
        totalDue.toLocaleString();


    const salesUp =
        salesData[
            salesData.length - 1
        ] >
        salesData[0];


    const dueUp =
        dueData[
            dueData.length - 1
        ] >
        dueData[0];


    document.getElementById(
        "salesTrend"
    ).textContent =
        salesUp
        ? "Sales increasing"
        : "Sales decreasing";


    document.getElementById(
        "dueTrend"
    ).textContent =
        dueUp
        ? "Due increasing"
        : "Due decreasing";


    document.getElementById(
        "salesDirection"
    ).textContent =
        salesUp
        ? "↑ Increasing"
        : "↓ Decreasing";


    document.getElementById(
        "dueDirection"
    ).textContent =
        dueUp
        ? "↑ Increasing"
        : "↓ Decreasing";


    /*
       Sales বাড়লে সবুজ।
       Sales কমলে লাল।

       Due বাড়লে লাল।
       Due কমলে সবুজ।
    */

    document.getElementById(
        "salesDirection"
    ).style.color =
        salesUp
        ? "#18a957"
        : "#e53935";


    document.getElementById(
        "dueDirection"
    ).style.color =
        dueUp
        ? "#e53935"
        : "#18a957";

}


/* =========================
   GRAPH
========================= */

function drawChart(
    canvasId,
    data,
    type
){

    const canvas =
        document.getElementById(
            canvasId
        );

    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.clientWidth;

    const height = 150;

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;


    ctx.scale(
        ratio,
        ratio
    );


    const max =
        Math.max(...data);

    const min =
        Math.min(...data);


    const padding = 10;


    const step =
        (width - padding * 2) /
        (data.length - 1);


    const increasing =
        data[
            data.length - 1
        ] >
        data[0];


    /*
       Sales:
       বাড়লে Green
       কমলে Red

       Due:
       বাড়লে Red
       কমলে Green
    */

    let lineColor;


    if(type === "sales"){

        lineColor =
            increasing
            ? "#18a957"
            : "#e53935";

    }else{

        lineColor =
            increasing
            ? "#e53935"
            : "#18a957";

    }


    ctx.beginPath();


    data.forEach(
        (value,index) => {

            const x =
                padding +
                index * step;


            const y =
                height -
                padding -
                (
                    (value - min) /
                    (max - min || 1)
                ) *
                (
                    height -
                    padding * 2
                );


            if(index === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        lineColor;

    ctx.lineWidth = 3;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.stroke();


    /* Last Point */

    const lastIndex =
        data.length - 1;


    const lastX =
        padding +
        lastIndex * step;


    const lastY =
        height -
        padding -
        (
            (data[lastIndex] - min) /
            (max - min || 1)
        ) *
        (
            height -
            padding * 2
        );


    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        4,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        lineColor;

    ctx.fill();

}


/* =========================
   HISTORY LIST
========================= */

function createHistory(){

    const container =
        document.getElementById(
            "historyData"
        );


    container.innerHTML = "";


    for(
        let i = 29;
        i >= 0;
        i--
    ){

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "history-row";


        const day =
            30 - i;


        row.innerHTML = `

            <span>
                Day ${day}
            </span>

            <strong>
                Sales ৳${salesData[i].toLocaleString()}
                |
                Due ৳${dueData[i].toLocaleString()}
            </strong>

        `;


        container.appendChild(
            row
        );

    }

}


/* =========================
   APP INFO
========================= */

function showAppInfo(){

    alert(
        "Sales Management App\nVersion 1.0.0"
    );

}


/* =========================
   LOGOUT
========================= */

function logout(){

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if(!confirmLogout){
        return;
    }


    localStorage.removeItem(
        "loggedIn"
    );


    alert(
        "You have been logged out."
    );

}


/* =========================
   INITIALIZE
========================= */

applyTheme();

applySound();


const savedLanguage =
    localStorage.getItem(
        "language"
    ) || "bn";


document.getElementById(
    "languageSelect"
).value =
    savedLanguage;


changeLanguage(
    savedLanguage
);


/* Theme click fix */

document.querySelector(
    ".setting-item[onclick='toggleTheme']"
).onclick =
    toggleTheme;

</script>

</body>
</html>
