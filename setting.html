<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সেটিংস - হাফেজ তিজারাহ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
    background:#eef3f9;
    color:#111;
    transition:.4s;
}

.app{
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:white;
}

/* HEADER */
.header{
    height:115px;
    background:linear-gradient(135deg,#064dcc,#0865e8);
    color:white;
    display:flex;
    align-items:center;
    padding:15px;
    box-shadow:0 4px 15px #0002;
    animation:headerDown .7s ease;
}

.back{
    width:48px;
    height:48px;
    border:0;
    background:transparent;
    color:white;
    font-size:35px;
    cursor:pointer;
    transition:.25s;
}

.back:active{
    transform:translateX(-6px);
}

.header-title{
    flex:1;
    text-align:center;
}

.header-title h1{
    font-size:27px;
}

.header-title p{
    margin-top:5px;
    font-size:13px;
}

/* CONTENT */
.content{
    padding:15px;
}

/* SECTION */
.section{
    margin-bottom:14px;
    padding:13px;
    border:1px solid #dce5ef;
    border-radius:16px;
    background:white;
    box-shadow:0 4px 15px #00000008;
    animation:fadeUp .6s ease both;
}

.section-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
}

/* THEME */
.theme{
    width:100%;
    padding:14px;
    margin-bottom:8px;
    border:1px solid #dce5ef;
    background:#fff;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.theme.active{
    border-color:#0755ce;
    background:#f0f6ff;
}

.theme:active{
    transform:scale(.98);
}

/* SETTING ROW */
.row{
    min-height:65px;
    display:flex;
    align-items:center;
    border-bottom:1px solid #edf0f4;
    gap:12px;
}

.row:last-child{
    border-bottom:0;
}

.row-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e8f1ff;
    font-size:21px;
}

.row-info{
    flex:1;
}

.row-info strong{
    display:block;
    font-size:15px;
}

.row-info small{
    display:block;
    margin-top:4px;
    color:#666;
}

/* SWITCH */
.switch{
    position:relative;
    width:50px;
    height:28px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#bbb;
    border-radius:30px;
    cursor:pointer;
    transition:.3s;
}

.slider:before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.3s;
}

.switch input:checked + .slider{
    background:#0755ce;
}

.switch input:checked + .slider:before{
    transform:translateX(22px);
}

/* VOLUME */
.volume{
    width:110px;
}

.volume-value{
    width:40px;
}

/* LINK ROW */
.link{
    width:100%;
    min-height:65px;
    border:0;
    border-bottom:1px solid #edf0f4;
    background:white;
    display:flex;
    align-items:center;
    text-align:left;
    gap:12px;
    cursor:pointer;
    transition:.25s;
}

.link:last-child{
    border-bottom:0;
}

.link:active{
    background:#eef5ff;
    transform:translateX(5px);
}

.arrow{
    margin-left:auto;
    font-size:25px;
    color:#777;
}

/* LOGOUT */
.logout{
    width:100%;
    border:0;
    background:#fff0f0;
    color:#df2020;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.logout:active{
    transform:scale(.96);
}

/* SOUND PANEL */
.sound-panel{
    position:fixed;
    inset:0;
    background:#0007;
    display:none;
    align-items:flex-end;
    z-index:100;
}

.sound-panel.show{
    display:flex;
}

.sound-box{
    width:100%;
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:25px 25px 0 0;
    padding:20px;
    max-height:85vh;
    overflow:auto;
    animation:panelUp .4s ease;
}

.sound-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    font-size:22px;
}

.sound-item{
    border:1px solid #dce5ef;
    border-radius:14px;
    padding:13px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:10px;
}

.sound-info{
    flex:1;
}

.sound-info strong{
    display:block;
}

.sound-info small{
    color:#666;
}

.play{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #0755ce;
    background:white;
    color:#0755ce;
}

.select{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#0755ce;
    color:white;
}

.select.selected{
    animation:pulse .5s ease;
}

/* TOAST */
.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translate(-50%,100px);
    background:#0755ce;
    color:white;
    padding:12px 20px;
    border-radius:30px;
    opacity:0;
    transition:.35s;
    z-index:300;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* DARK MODE */
body.dark{
    background:#111827;
    color:#fff;
}

body.dark .app,
body.dark .section,
body.dark .theme,
body.dark .link,
body.dark .sound-box{
    background:#1f2937;
    color:white;
}

body.dark .row,
body.dark .link{
    border-color:#374151;
}

body.dark .theme.active{
    background:#263d61;
}

body.dark .row-info small,
body.dark .sound-info small{
    color:#aaa;
}

/* ANIMATIONS */
@keyframes headerDown{
    from{transform:translateY(-100%);opacity:0}
    to{transform:translateY(0);opacity:1}
}

@keyframes fadeUp{
    from{transform:translateY(25px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

@keyframes panelUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.25)}
    100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <button class="back"
            onclick="location.href='index.html'">
        ‹
    </button>

    <div class="header-title">
        <h1>সেটিংস</h1>
        <p>আপনার অ্যাপ সেটিংস পরিচালনা করুন</p>
    </div>

    <div style="width:48px;text-align:center;font-size:28px">
        ⚙
    </div>

</header>

<main class="content">

<!-- THEME -->
<section class="section">

<div class="section-title">🎨 থিম (Theme)</div>

<button class="theme active" id="lightBtn"
        onclick="setLight()">
    <span>◉ &nbsp; Light Theme</span>
    <span>☀️</span>
</button>

<button class="theme" id="darkBtn"
        onclick="setDark()">
    <span>○ &nbsp; Dark Theme</span>
    <span>🌙</span>
</button>

</section>


<!-- SOUND -->
<section class="section">

<div class="section-title">🔊 সাউন্ড সেটিংস</div>

<div class="row">

<div class="row-icon">🔊</div>

<div class="row-info">
<strong>Sound On / Off</strong>
<small>সাউন্ড চালু / বন্ধ করুন</small>
</div>

<label class="switch">
<input type="checkbox" id="soundToggle" checked>
<span class="slider"></span>
</label>

</div>


<div class="row">

<div class="row-icon">🔉</div>

<div class="row-info">
<strong>ভলিউম (Volume)</strong>
<small>সাউন্ডের মাত্রা নিয়ন্ত্রণ করুন</small>
</div>

<input class="volume"
       type="range"
       min="0"
       max="100"
       value="70"
       oninput="volumeValue.innerText=this.value+'%'">

<span id="volumeValue"
      class="volume-value">70%</span>

</div>


<button class="link"
        onclick="openSound()">

<div class="row-icon">🎵</div>

<div class="row-info">
<strong>সাউন্ড টাইপ (Sound Type)</strong>
<small>প্রতিটি একশনের জন্য সাউন্ড নির্বাচন করুন</small>
</div>

<span class="arrow">›</span>

</button>


<button class="link"
        onclick="showToast('Custom Sound অপশন')">

<div class="row-icon">🔐</div>

<div class="row-info">
<strong>Custom Sound</strong>
<small>নিজের পছন্দের সাউন্ড যোগ করুন</small>
</div>

<span class="arrow">›</span>

</button>

</section>


<!-- HISTORY -->
<section class="section">

<button class="link"
        onclick="showToast('Sales History খুলছে')">

<div class="row-icon">📊</div>

<div class="row-info">
<strong>Sales History</strong>
<small>গত ৩০ দিনের বিক্রির বিবরণ দেখুন</small>
</div>

<span class="arrow">›</span>

</button>


<button class="link"
        onclick="showToast('Due History খুলছে')">

<div class="row-icon">🧾</div>

<div class="row-info">
<strong>Due History</strong>
<small>গত ৩০ দিনের বাকি বিবরণ দেখুন</small>
</div>

<span class="arrow">›</span>

</button>

</section>


<!-- OTHER -->
<section class="section">

<button class="link"
        onclick="showToast('Backup & Restore')">

<div class="row-icon">☁️</div>

<div class="row-info">
<strong>Backup & Restore</strong>
<small>ডাটা ব্যাকআপ নিন এবং রিস্টোর করুন</small>
</div>

<span class="arrow">›</span>

</button>


<button class="link"
        onclick="showToast('About App')">

<div class="row-icon">ⓘ</div>

<div class="row-info">
<strong>About App</strong>
<small>অ্যাপের তথ্য ও ভার্সন দেখুন</small>
</div>

<span class="arrow">›</span>

</button>


<button class="link"
        onclick="showToast('ভাষা: বাংলা')">

<div class="row-icon">🌐</div>

<div class="row-info">
<strong>Language (ভাষা)</strong>
<small>অ্যাপের ভাষা পরিবর্তন করুন</small>
</div>

<strong>বাংলা</strong>

<span class="arrow">›</span>

</button>

</section>


<!-- LOGOUT -->
<section class="section">

<button class="logout"
        onclick="showToast('Logout নির্বাচন করা হয়েছে')">
    🚪 Logout
</button>

</section>

</main>
</div>


<!-- SOUND PANEL -->

<div class="sound-panel" id="soundPanel">

<div class="sound-box">

<div class="sound-head">
<h2>🔊 সাউন্ড টাইপ</h2>

<button class="close"
        onclick="closeSound()">×</button>
</div>


<script>

const sounds=[
    ["🔵","Button Click Sound","বাটন ক্লিক করার সাউন্ড","Sound 03"],
    ["🟢","Amount Select Sound","মোট টাকা সিলেক্ট করার সাউন্ড","Sound 07"],
    ["🟠","Add to Total Sound","মোট টাকায় যোগ করার সাউন্ড","Sound 12"],
    ["🔴","Delete / Cancel Sound","মুছে ফেলা বা বাতিল করার সাউন্ড","Sound 05"],
    ["🟣","Settings Click Sound","সেটিংসে ক্লিক করার সাউন্ড","Sound 02"],
    ["💾","Save Sound","তথ্য সেভ করার সাউন্ড","Sound 09"],
    ["🔔","Notification Sound","নোটিফিকেশনের সাউন্ড","Sound 10"],
    ["💳","Payment Complete Sound","পেমেন্ট সম্পন্ন করার সাউন্ড","Sound 15"]
];

sounds.forEach((s,i)=>{

    document.write(`
    <div class="sound-item">

        <div style="font-size:23px">${s[0]}</div>

        <div class="sound-info">
            <strong>${s[1]}</strong>
            <small>${s[2]}</small>
            <br>
            <select style="margin-top:7px;padding:6px;border-radius:7px">
                <option>${s[3]}</option>
                <option>Sound 01</option>
                <option>Sound 02</option>
                <option>Sound 04</option>
                <option>Sound 06</option>
            </select>
        </div>

        <button class="play"
                onclick="showToast('▶ ${s[3]} Play')">
            ▶
        </button>

        <button class="select"
                onclick="selectSound(this)">
            ✓
        </button>

    </div>
    `);

});

</script>

</div>
</div>


<div id="toast" class="toast"></div>


<script>

function openSound(){
    document.getElementById("soundPanel").classList.add("show");
}

function closeSound(){
    document.getElementById("soundPanel").classList.remove("show");
}

function selectSound(btn){

    document.querySelectorAll(".select").forEach(b=>{
        b.classList.remove("selected");
    });

    btn.classList.add("selected");

    showToast("সাউন্ড সিলেক্ট হয়েছে ✓");
}

function setDark(){

    document.body.classList.add("dark");

    document.getElementById("darkBtn").classList.add("active");
    document.getElementById("lightBtn").classList.remove("active");

    localStorage.setItem("theme","dark");
}

function setLight(){

    document.body.classList.remove("dark");

    document.getElementById("lightBtn").classList.add("active");
    document.getElementById("darkBtn").classList.remove("active");

    localStorage.setItem("theme","light");
}

if(localStorage.getItem("theme")==="dark"){
    setDark();
}

function showToast(text){

    const toast=document.getElementById("toast");

    toast.innerText=text;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },1800);
}

</script>

</body>
</html>
