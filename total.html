<!-- =========================================================
     সেকশন: সর্বমোট টাকা ও আজকের মোট লেনদেন
     ফাইল: index.html
========================================================= -->

<section id="moneySummarySection">

    <!-- সর্বমোট টাকা -->
    <div class="money-summary-card">

        <div class="money-summary-icon">
            ৳
        </div>

        <div class="money-summary-info">

            <div class="money-summary-title">
                সর্বমোট টাকা
            </div>

            <div
                class="money-summary-value"
                id="totalMoneyValue">
                ৳ ০
            </div>

        </div>

    </div>


    <!-- আজকের মোট লেনদেন -->
    <div class="money-summary-card">

        <div class="money-summary-icon transaction-icon">
            ⇄
        </div>

        <div class="money-summary-info">

            <div class="money-summary-title">
                আজকের মোট লেনদেন
            </div>

            <div
                class="money-summary-value"
                id="todayTransactionValue">
                ০
            </div>

        </div>

    </div>

</section>


<style>

/* =========================================================
   সর্বমোট টাকা ও আজকের মোট লেনদেন
   CSS
========================================================= */

#moneySummarySection{

    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:10px;

    padding:10px 12px;

}


/* =========================
   মূল Card
========================= */

.money-summary-card{

    min-width:0;

    min-height:92px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:12px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f6f9fd
        );

    border:1px solid #e1e8f0;

    border-radius:16px;

    box-shadow:
        0 4px 12px
        rgba(0,55,120,.08);

    animation:
        moneyCardIn .28s
        ease-out both;

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


/* দ্বিতীয় Card-এর Animation সামান্য পরে */

.money-summary-card:nth-child(2){

    animation-delay:.05s;

}


/* Click effect */

.money-summary-card:active{

    transform:scale(.96);

    box-shadow:
        0 2px 7px
        rgba(0,55,120,.10);

}


/* =========================
   ছোট Symbol
========================= */

.money-summary-icon{

    width:40px;

    height:40px;

    min-width:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    color:#0757d5;

    background:
        linear-gradient(
            135deg,
            #e8f1ff,
            #dceaff
        );

    font-size:20px;

    font-weight:800;

}


/* Transaction Symbol */

.transaction-icon{

    font-size:22px;

}


/* =========================
   Text Area
========================= */

.money-summary-info{

    min-width:0;

    flex:1;

}


/* =========================
   Title
========================= */

.money-summary-title{

    color:#687585;

    font-size:11px;

    font-weight:500;

    line-height:1.3;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================
   Amount / Number
========================= */

.money-summary-value{

    margin-top:5px;

    color:#0757d5;

    font-size:20px;

    font-weight:800;

    line-height:1.15;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================
   Value Update Animation
========================= */

.money-value-update{

    animation:
        moneyValuePop .22s
        ease-out;

}


/* =========================
   Card Entry Animation
========================= */

@keyframes moneyCardIn{

    from{

        opacity:0;

        transform:
            translateY(12px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   Number Update Animation
========================= */

@keyframes moneyValuePop{

    0%{

        transform:scale(1);

    }

    45%{

        transform:scale(1.09);

    }

    100%{

        transform:scale(1);

    }

}


/* =========================================================
   Oppo F17 / ছোট Screen
========================================================= */

@media(max-width:380px){

    #moneySummarySection{

        gap:8px;

        padding:
            8px 10px;

    }

    .money-summary-card{

        min-height:86px;

        padding:9px;

        gap:7px;

    }

    .money-summary-icon{

        width:35px;

        height:35px;

        min-width:35px;

        border-radius:10px;

        font-size:18px;

    }

    .transaction-icon{

        font-size:19px;

    }

    .money-summary-title{

        font-size:10px;

    }

    .money-summary-value{

        font-size:18px;

        margin-top:4px;

    }

}

</style>


<script>

/* =========================================================
   সর্বমোট টাকা ও আজকের মোট লেনদেন
   JAVASCRIPT
========================================================= */


/* =========================
   ডাটা
========================= */

let totalMoney = 0;

let todayTransactions = 0;


/* =========================
   HTML Elements
========================= */

const totalMoneyValue =
    document.getElementById(
        "totalMoneyValue"
    );


const todayTransactionValue =
    document.getElementById(
        "todayTransactionValue"
    );


/* =========================
   বাংলা Number
========================= */

function formatBanglaNumber(number){

    return Number(number)
        .toLocaleString("bn-BD");

}


/* =========================
   সর্বমোট টাকা দেখানো
========================= */

function updateTotalMoney(amount){

    totalMoney =
        Number(amount) || 0;

    totalMoneyValue.textContent =
        "৳ " +
        formatBanglaNumber(
            totalMoney
        );

    animateMoneyValue(
        totalMoneyValue
    );

}


/* =========================
   আজকের লেনদেন দেখানো
========================= */

function updateTodayTransactions(count){

    todayTransactions =
        Number(count) || 0;

    todayTransactionValue.textContent =
        formatBanglaNumber(
            todayTransactions
        );

    animateMoneyValue(
        todayTransactionValue
    );

}


/* =========================
   Value Animation
========================= */

function animateMoneyValue(element){

    element.classList.remove(
        "money-value-update"
    );

    /*
       Animation পুনরায় চালানোর জন্য
       Browser Reflow করা হচ্ছে।
    */

    void element.offsetWidth;

    element.classList.add(
        "money-value-update"
    );

}


/* =========================
   নতুন লেনদেন যোগ করা
========================= */

function addTransactionToHome(amount){

    amount =
        Number(amount) || 0;

    totalMoney += amount;

    todayTransactions += 1;

    updateTotalMoney(
        totalMoney
    );

    updateTodayTransactions(
        todayTransactions
    );

}


/* =========================
   শুধুমাত্র টাকা পরিবর্তন
========================= */

function addMoneyOnly(amount){

    amount =
        Number(amount) || 0;

    totalMoney += amount;

    updateTotalMoney(
        totalMoney
    );

}


/* =========================
   লেনদেন সংখ্যা বাড়ানো
========================= */

function addTransactionOnly(){

    todayTransactions += 1;

    updateTodayTransactions(
        todayTransactions
    );

}


/* =========================
   আজকের হিসাব Reset
========================= */

function resetTodaySummary(){

    totalMoney = 0;

    todayTransactions = 0;

    updateTotalMoney(0);

    updateTodayTransactions(0);

}


/* =========================
   শুরুতে ০ দেখাবে
========================= */

updateTotalMoney(0);

updateTodayTransactions(0);


/* =========================================================
   VIBRATION নিষ্ক্রিয়
========================================================= */

/*
   এখানে কোনো navigator.vibrate()
   ব্যবহার করা হয়নি।

   তাই এই Section-এর কোনো
   Click/Touch থেকে vibration
   হবে না।
*/

</script>
