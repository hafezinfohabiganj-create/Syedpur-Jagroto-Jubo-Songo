<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>হাফেজ তিজারা</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Noto Sans Bengali",
        "SolaimanLipi",
        Arial,
        sans-serif;
    background:#f1f3f5;
}

.app{
    width:100%;
    height:100dvh;
    max-height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#f4f6f8;
}

/* ================= HEADER ================= */

.header{
    flex:0 0 54px;
    height:54px;
    background:#087bd1;
    color:#fff;

    display:grid;
    grid-template-columns:48px 1fr 48px;
    align-items:center;

    padding:0 4px;

    box-shadow:0 2px 5px rgba(0,0,0,.18);
}

.menu-btn,
.more-btn{
    width:44px;
    height:44px;

    border:0;
    background:transparent;
    color:white;

    font-size:30px;
    font-weight:bold;
}

.header-title{
    text-align:center;
    font-size:24px;
    font-weight:900;
    white-space:nowrap;
}

/* ================= TOTAL ================= */

.total-box{
    flex:0 0 72px;
    height:72px;

    margin:5px 7px 4px;
    padding:5px 12px;

    background:#fff;
    border-radius:11px;

    box-shadow:
        0 2px 6px rgba(0,0,0,.10);
}

.total-label{
    font-size:14px;
    color:#777;
    line-height:17px;
}

.total-money{
    color:#087bd1;
    font-size:36px;
    font-weight:900;
    line-height:37px;
}

.total-count{
    color:#777;
    font-size:11px;
    line-height:13px;
}

/* ================= REPORT ================= */

.report-grid{
    flex:0 0 49px;
    height:49px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;

    padding:0 7px 4px;
}

.report-box{
    background:#fff;
    border-radius:8px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 1px 4px rgba(0,0,0,.08);

    overflow:hidden;
}

.report-title{
    color:#777;
    font-size:9px;
    line-height:11px;
    white-space:nowrap;
}

.report-value{
    color:#087bd1;
    font-size:15px;
    line-height:17px;
    font-weight:900;
}

/* ================= 1 - 5 ================= */

.extra-row{
    flex:0 0 38px;
    height:38px;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;

    padding:0 7px 4px;
}

.extra-btn{
    border:0;
    border-radius:7px;

    background:#e1effc;
    color:#087bd1;

    font-size:20px;
    font-weight:900;

    box-shadow:
        0 1px 3px rgba(0,0,0,.10);
}

.extra-btn:active{
    background:#087bd1;
    color:white;
    transform:scale(.96);
}

/* ================= MONEY GRID ================= */

.money-grid{
    flex:1;
    min-height:0;

    display:grid;

    /* ৪ কলাম */
    grid-template-columns:
        repeat(4,minmax(0,1fr));

    /* ৫ সারি */
    grid-template-rows:
        repeat(5,minmax(0,1fr));

    gap:5px;

    padding:
        0 7px 6px;

    overflow:hidden;
}

/* ================= MONEY CARD ================= */

.money-card{
    min-width:0;
    min-height:0;

    background:#fff;
    border-radius:8px;

    padding:3px;

    display:flex;
    flex-direction:column;

    box-shadow:
        0 1px 5px rgba(0,0,0,.10);
}

/* টাকার নাম */

.money-title{
    height:24px;
    flex:0 0 24px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#222;

    font-size:19px;
    line-height:21px;
    font-weight:900;

    white-space:nowrap;
}

/* ওই টাকায় মোট কত হয়েছে */

.money-total{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#087bd1;

    font-size:11px;
    font-weight:900;

    white-space:nowrap;
}

/* ================= PLUS MINUS ================= */

.control{
    flex:0 0 30px;
    height:30px;

    display:grid;
    grid-template-columns:30px 1fr 30px;

    border:1px solid #d8dadd;
    border-radius:6px;

    overflow:hidden;
}

.control button{
    border:0;

    background:#eef0f2;

    color:#111;

    font-size:22px;
    font-weight:900;

    display:flex;
    align-items:center;
    justify-content:center;
}

.control button:active{
    background:#d7e9fa;
}

.quantity{
    display:flex;
    align-items:center;
    justify-content:center;

    background:white;

    color:#111;

    font-size:19px;
    font-weight:900;
}

/* ================= MENU ================= */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.40);

    z-index:100;

    display:none;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;

    top:0;
    left:-275px;

    width:275px;
    height:100%;

    background:white;

    z-index:200;

    transition:.2s;

    box-shadow:
        3px 0 12px rgba(0,0,0,.25);
}

.side-menu.open{
    left:0;
}

.side-title{
    height:55px;

    background:#087bd1;
    color:white;

    display:flex;
    align-items:center;

    padding:0 16px;

    font-size:21px;
    font-weight:900;
}

.side-item{
    padding:17px 16px;

    border-bottom:1px solid #eee;

    font-size:16px;
}

/* ================= REPORT PAGE ================= */

.report-page{
    position:fixed;
    inset:0;

    background:#f4f6f8;

    z-index:500;

    display:none;

    overflow:hidden;
}

.report-header{
    height:54px;

    background:#087bd1;
    color:white;

    display:flex;
    align-items:center;

    padding:0 10px;

    font-size:21px;
    font-weight:900;
}

.back{
    width:44px;
    height:44px;

    border:0;
    background:transparent;
    color:white;

    font-size:35px;
}

.report-content{
    padding:8px;
}

.detail-box{
    background:white;

    border-radius:10px;

    padding:13px;

    margin-bottom:7px;

    box-shadow:
        0 1px 5px rgba(0,0,0,.09);
}

.detail-title{
    color:#777;
    font-size:14px;
}

.detail-money{
    color:#087bd1;
    font-size:29px;
    font-weight:900;
}

/* ================= OPPO F17 / SMALL HEIGHT ================= */

@media(max-height:700px){

    .header{
        flex-basis:48px;
        height:48px;
    }

    .header-title{
        font-size:21px;
    }

    .total-box{
        flex-basis:62px;
        height:62px;

        margin:4px 6px 3px;
    }

    .total-money{
        font-size:31px;
        line-height:31px;
    }

    .report-grid{
        flex-basis:43px;
        height:43px;
    }

    .extra-row{
        flex-basis:34px;
        height:34px;
    }

    .money-title{
        font-size:17px;
        height:21px;
        flex-basis:21px;
    }

    .money-total{
        font-size:10px;
    }

    .control{
        height:27px;
        flex-basis:27px;
        grid-template-columns:27px 1fr 27px;
    }

    .control button{
        font-size:20px;
    }

    .quantity{
        font-size:17px;
    }
}

/* ================= VERY SMALL SCREEN ================= */

@media(max-height:620px){

    .header{
        flex-basis:44px;
        height:44px;
    }

    .header-title{
        font-size:19px;
    }

    .total-box{
        flex-basis:55px;
        height:55px;
        padding:3px 9px;
    }

    .total-label{
        font-size:11px;
    }

    .total-money{
        font-size:27px;
        line-height:27px;
    }

    .total-count{
        font-size:9px;
    }

    .report-grid{
        flex-basis:39px;
        height:39px;
    }

    .extra-row{
        flex-basis:31px;
        height:31px;
    }

    .money-title{
        font-size:15px;
        height:19px;
        flex-basis:19px;
    }

    .money-total{
        font-size:9px;
    }

    .control{
        height:24px;
        flex-basis:24px;
        grid-template-columns:24px 1fr 24px;
    }

    .control button{
        font-size:18px;
    }

    .quantity{
        font-size:15px;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <button class="menu-btn"
                onclick="openMenu()">
            ☰
        </button>

        <div class="header-title">
            হাফেজ তিজারা
        </div>

        <button class="more-btn">
            ⋮
        </button>

    </div>


    <!-- TOTAL -->
    <div class="total-box">

        <div class="total-label">
            সর্বমোট টাকা
        </div>

        <div class="total-money"
             id="grandTotal">
            ৳ ০
        </div>

        <div class="total-count"
             id="grandCount">
            মোট ০ টি
        </div>

    </div>


    <!-- TODAY / 7 / 30 / YEAR -->
    <div class="report-grid">

        <div class="report-box">
            <div class="report-title">
                আজ
            </div>
            <div class="report-value"
                 id="today">
                ৳ ০
            </div>
        </div>

        <div class="report-box">
            <div class="report-title">
                গত ৭ দিন
            </div>
            <div class="report-value"
                 id="week">
                ৳ ০
            </div>
        </div>

        <div class="report-box">
            <div class="report-title">
                গত ১ মাস
            </div>
            <div class="report-value"
                 id="month">
                ৳ ০
            </div>
        </div>

        <div class="report-box">
            <div class="report-title">
                গত ১ বছর
            </div>
            <div class="report-value"
                 id="year">
                ৳ ০
            </div>
        </div>

    </div>


    <!-- ১ - ৫ -->
    <div class="extra-row">

        <button class="extra-btn"
                onclick="addExtra(1)">
            ১
        </button>

        <button class="extra-btn"
                onclick="addExtra(2)">
            ২
        </button>

        <button class="extra-btn"
                onclick="addExtra(3)">
            ৩
        </button>

        <button class="extra-btn"
                onclick="addExtra(4)">
            ৪
        </button>

        <button class="extra-btn"
                onclick="addExtra(5)">
            ৫
        </button>

    </div>


    <!-- ৫ - ১০০ -->
    <div class="money-grid"
         id="moneyGrid">
    </div>

</div>


<!-- OVERLAY -->

<div class="overlay"
     id="overlay"
     onclick="closeMenu()">
</div>


<!-- SIDE MENU -->

<div class="side-menu"
     id="sideMenu">

    <div class="side-title">
        হাফেজ তিজারা
    </div>

    <div class="side-item"
         onclick="showReport()">
        📊 বিস্তারিত হিসাব
    </div>

    <div class="side-item"
         onclick="resetToday()">
        🔄 আজকের হিসাব রিসেট
    </div>

    <div class="side-item"
         onclick="resetAll()">
        🗑️ সব হিসাব মুছে ফেলুন
    </div>

</div>


<!-- REPORT -->

<div class="report-page"
     id="reportPage">

    <div class="report-header">

        <button class="back"
                onclick="closeReport()">
            ‹
        </button>

        <span>
            বিস্তারিত হিসাব
        </span>

    </div>

    <div class="report-content">

        <div class="detail-box">

            <div class="detail-title">
                আজকের হিসাব
            </div>

            <div class="detail-money"
                 id="detailToday">
                ৳ ০
            </div>

        </div>

        <div class="detail-box">

            <div class="detail-title">
                গত ৭ দিনের হিসাব
            </div>

            <div class="detail-money"
                 id="detailWeek">
                ৳ ০
            </div>

        </div>

        <div class="detail-box">

            <div class="detail-title">
                গত ১ মাসের হিসাব
            </div>

            <div class="detail-money"
                 id="detailMonth">
                ৳ ০
            </div>

        </div>

        <div class="detail-box">

            <div class="detail-title">
                গত ১ বছরের হিসাব
            </div>

            <div class="detail-money"
                 id="detailYear">
                ৳ ০
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   ৫ থেকে ১০০
========================================= */

const prices = [];

for(let i = 5; i <= 100; i += 5){
    prices.push(i);
}


/* =========================================
   DATA
========================================= */

let quantities =
    JSON.parse(
        localStorage.getItem(
            "hafiz_quantities"
        )
    ) || {};

let extras =
    JSON.parse(
        localStorage.getItem(
            "hafiz_extras"
        )
    ) || {};

let history =
    JSON.parse(
        localStorage.getItem(
            "hafiz_history"
        )
    ) || {};


/* =========================================
   বাংলা সংখ্যা
========================================= */

function bn(n){

    return Number(n).toLocaleString("bn-BD");

}


/* =========================================
   TODAY
========================================= */

function todayKey(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1)
            .padStart(2,"0")
        + "-"
        + String(d.getDate())
            .padStart(2,"0");

}


/* =========================================
   SAVE
========================================= */

function save(){

    localStorage.setItem(
        "hafiz_quantities",
        JSON.stringify(quantities)
    );

    localStorage.setItem(
        "hafiz_extras",
        JSON.stringify(extras)
    );

    localStorage.setItem(
        "hafiz_history",
        JSON.stringify(history)
    );

}


/* =========================================
   RECORD
========================================= */

function record(amount){

    const day = todayKey();

    if(!history[day]){
        history[day] = [];
    }

    history[day].push({
        amount:Number(amount),
        time:Date.now()
    });

}


/* =========================================
   PLUS
========================================= */

function plus(price){

    if(!quantities[price]){
        quantities[price] = 0;
    }

    quantities[price]++;

    record(price);

    save();

    render();

}


/* =========================================
   MINUS
========================================= */

function minus(price){

    if(
        !quantities[price] ||
        quantities[price] <= 0
    ){
        return;
    }

    quantities[price]--;

    record(-price);

    save();

    render();

}


/* =========================================
   ১ - ৫
========================================= */

function addExtra(value){

    if(!extras[value]){
        extras[value] = 0;
    }

    extras[value]++;

    record(value);

    save();

    render();

}


/* =========================================
   TOTAL
========================================= */

function totalAmount(){

    let total = 0;

    prices.forEach(price => {

        total +=
            price *
            Number(quantities[price] || 0);

    });

    for(let i=1;i<=5;i++){

        total +=
            i *
            Number(extras[i] || 0);

    }

    return total;

}


/* =========================================
   COUNT
========================================= */

function totalCount(){

    let count = 0;

    prices.forEach(price => {

        count +=
            Number(
                quantities[price] || 0
            );

    });

    for(let i=1;i<=5;i++){

        count +=
            Number(
                extras[i] || 0
            );

    }

    return count;

}


/* =========================================
   PERIOD TOTAL
========================================= */

function periodTotal(days){

    let total = 0;

    const now = new Date();

    const start = new Date(now);

    start.setHours(0,0,0,0);

    start.setDate(
        start.getDate() - days
    );


    Object.keys(history).forEach(day => {

        const d =
            new Date(day + "T00:00:00");

        if(d >= start){

            history[day].forEach(item => {

                if(item.amount > 0){

                    total +=
                        Number(item.amount);

                }

            });

        }

    });


    return total;

}


/* =========================================
   CREATE CARDS
========================================= */

function render(){

    const grid =
        document.getElementById(
            "moneyGrid"
        );

    grid.innerHTML = "";


    prices.forEach(price => {

        const qty =
            Number(
                quantities[price] || 0
            );

        const total =
            price * qty;


        const card =
            document.createElement("div");

        card.className =
            "money-card";


        card.innerHTML = `

            <div class="money-title">
                ৳ ${bn(price)}
            </div>

            <div class="money-total">
                মোট ৳ ${bn(total)}
            </div>

            <div class="control">

                <button
                    onclick="minus(${price})">
                    −
                </button>

                <div class="quantity">
                    ${bn(qty)}
                </div>

                <button
                    onclick="plus(${price})">
                    +
                </button>

            </div>
        `;


        grid.appendChild(card);

    });


    /* সর্বমোট */

    document.getElementById(
        "grandTotal"
    ).innerText =
        "৳ " + bn(totalAmount());


    document.getElementById(
        "grandCount"
    ).innerText =
        "মোট " + bn(totalCount()) + " টি";


    /* রিপোর্ট */

    document.getElementById(
        "today"
    ).innerText =
        "৳ " + bn(periodTotal(0));


    document.getElementById(
        "week"
    ).innerText =
        "৳ " + bn(periodTotal(6));


    document.getElementById(
        "month"
    ).innerText =
        "৳ " + bn(periodTotal(29));


    document.getElementById(
        "year"
    ).innerText =
        "৳ " + bn(periodTotal(364));

}


/* =========================================
   MENU
========================================= */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* =========================================
   REPORT
========================================= */

function showReport(){

    closeMenu();

    document
        .getElementById("reportPage")
        .style.display = "block";


    document.getElementById(
        "detailToday"
    ).innerText =
        "৳ " + bn(periodTotal(0));


    document.getElementById(
        "detailWeek"
    ).innerText =
        "৳ " + bn(periodTotal(6));


    document.getElementById(
        "detailMonth"
    ).innerText =
        "৳ " + bn(periodTotal(29));


    document.getElementById(
        "detailYear"
    ).innerText =
        "৳ " + bn(periodTotal(364));

}


function closeReport(){

    document
        .getElementById("reportPage")
        .style.display = "none";

}


/* =========================================
   RESET ALL
========================================= */

function resetAll(){

    closeMenu();

    if(
        !confirm(
            "সব হিসাব মুছে ফেলবেন?"
        )
    ){
        return;
    }

    quantities = {};
    extras = {};
    history = {};

    save();

    render();

}


/* =========================================
   RESET TODAY
========================================= */

function resetToday(){

    closeMenu();

    if(
        !confirm(
            "আজকের হিসাব মুছে ফেলবেন?"
        )
    ){
        return;
    }

    delete history[todayKey()];

    quantities = {};
    extras = {};

    /*
       পুরোনো দিনের হিসাব থেকে
       বর্তমান quantity আবার তৈরি করা হবে।
    */

    Object.keys(history).forEach(day => {

        history[day].forEach(item => {

            const amount =
                Number(item.amount);


            if(amount <= 0){
                return;
            }


            if(
                amount >= 5 &&
                amount <= 100 &&
                amount % 5 === 0
            ){

                if(!quantities[amount]){
                    quantities[amount] = 0;
                }

                quantities[amount]++;

            }
            else if(
                amount >= 1 &&
                amount <= 5
            ){

                if(!extras[amount]){
                    extras[amount] = 0;
                }

                extras[amount]++;

            }

        });

    });


    save();

    render();

}


/* =========================================
   START
========================================= */

render();

</script>

</body>
</html>
