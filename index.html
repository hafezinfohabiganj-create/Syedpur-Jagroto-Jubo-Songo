<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>হাফেজ তিজারাহ</title>

    <style>
        /* =========================
           HEADER
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            background: #eef5fb;
            font-family: "Noto Sans Bengali", sans-serif;
        }

        .main-header {
            position: relative;
            width: 100%;
            height: 170px;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(255, 255, 255, 0.10),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0878df 0%,
                    #087bea 45%,
                    #168cf0 100%
                );

            border-radius: 0 0 38px 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 12px 28px rgba(0, 80, 160, 0.18);
        }


        /* =========================
           CENTER BRAND
        ========================= */

        .brand-area {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: max-content;

            text-align: center;

            color: #ffffff;
        }


        .brand-area h1 {
            margin: 0;

            font-size: 36px;
            line-height: 1.2;

            font-weight: 800;

            color: #ffffff;

            white-space: nowrap;

            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.08);
        }


        .brand-area p {
            margin: 6px 0 0;

            font-size: 18px;
            line-height: 1.3;

            font-weight: 400;

            color: #ffffff;

            white-space: nowrap;
        }


        /* =========================
           MENU BUTTON
        ========================= */

        .menu-btn {
            position: absolute;

            left: 22px;
            top: 50%;

            transform: translateY(-50%);

            width: 58px;
            height: 58px;

            border: none;
            outline: none;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 6px;

            cursor: pointer;

            padding: 0;

            z-index: 10;
        }


        .menu-btn span {
            display: block;

            width: 28px;
            height: 3px;

            background: #ffffff;

            border-radius: 10px;

            transition: 0.25s ease;
        }


        /* =========================
           MENU CLICK ANIMATION
        ========================= */

        .menu-btn.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .main-header {
                height: 170px;

                border-radius: 0 0 36px 36px;
            }


            .brand-area {
                left: 50%;
                top: 50%;

                transform: translate(-50%, -50%);

                width: calc(100% - 100px);

                text-align: center;
            }


            .brand-area h1 {
                font-size: 29px;
            }


            .brand-area p {
                margin-top: 5px;

                font-size: 16px;
            }


            .menu-btn {
                left: 18px;

                width: 52px;
                height: 52px;

                border-radius: 16px;
            }


            .menu-btn span {
                width: 25px;
                height: 3px;
            }
        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {

            .main-header {
                height: 160px;
            }


            .brand-area {
                width: calc(100% - 90px);
            }


            .brand-area h1 {
                font-size: 25px;
            }


            .brand-area p {
                font-size: 14px;
            }


            .menu-btn {
                left: 14px;

                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>

<body>


    <!-- =========================
         HEADER SECTION
    ========================= -->

    <header class="main-header">

        <!-- Menu Button -->
        <button
            class="menu-btn"
            id="menuButton"
            aria-label="Menu"
            type="button"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <!-- Center Brand -->
        <div class="brand-area">

            <h1>হাফেজ তিজারাহ</h1>

            <p>পরিবারের নিত্যদিনের বাজার</p>

        </div>

    </header>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const menuButton =
            document.getElementById("menuButton");


        menuButton.addEventListener("click", function () {

            this.classList.toggle("active");

        });

    </script>

</body>
</html>
