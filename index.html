<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>হাফেজ তিজারা</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Noto Sans Bengali","SolaimanLipi",Arial,sans-serif;
    background:#f1f3f5;
    color:#202124;
    transition:.25s;
}

.app{
    width:100%;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    flex:0 0 42px;
    height:42px;
    display:grid;
    grid-template-columns:40px 1fr 40px;
    align-items:center;
    background:#087bd1;
    color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.16);
}

.header-title{
    text-align:center;
    font-size:18px;
    font-weight:900;
}

.menu-btn,.more-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:24px;
    font-weight:bold;
}

.menu-btn:active,.more-btn:active{
    transform:scale(.88);
}

/* TOTAL */

.total-box{
    flex:0 0 58px;
    height:58px;
    margin:4px 6px 3px;
    padding:4px 10px;
    display:grid;
    grid-template-columns:1fr 105px;
    align-items:center;
    background:#fff;
    border-radius:9px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.total-label,
.today-label{
    color:#777;
    font-size:10px;
}

.total-money{
    color:#087bd1;
    font-size:26px;
    line-height:27px;
    font-weight:900;
}

.total-count{
    color:#999;
    font-size:8px;
}

.today-box{
    text-align:center;
    border-left:1px solid #e2e2e2;
    padding-left:8px;
}

.today-number{
    color:#087bd1;
    font-size:18px;
    font-weight:900;
    line-height:20px;
}

/* REPORT */

.report-grid{
    flex:0 0 38px;
    height:38px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    padding:0 6px 3px;
}

.report-box{
    background:#fff;
    border-radius:7px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
}

.report-title{
    color:#777;
    font-size:8px;
}

.report-value{
    color:#087bd1;
    font-size:12px;
    font-weight:900;
}

/* 1-5 */

.extra-row{
    flex:0 0 31px;
    height:31px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    padding:0 6px 3px;
}

.extra-btn{
    border:0;
    border-radius:6px;
    background:#e7f1fa;
    color:#087bd1;
    font-size:16px;
    font-weight:900;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    transition:transform .08s,box-shadow .08s;
}

.extra-btn:active{
    transform:scale(.90);
    box-shadow:0 4px 10px rgba(0,0,0,.22);
}

/* MONEY GRID */

.money-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-template-rows:repeat(5,minmax(0,1fr));
    gap:4px;
    padding:0 6px 5px;
    overflow:hidden;
}

.money-card{
    min-width:0;
    min-height:0;
    background:#fff;
    border-radius:7px;
    padding:2px;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    transition:transform .10s,box-shadow .10s;
}

.money-card:active{
    transform:scale(.975);
    box-shadow:0 5px 14px rgba(0,0,0,.20);
}

.money-title{
    flex:0 0 20px;
    height:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:900;
}

.money-total{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#087bd1;
    font-size:9px;
    font-weight:900;
}

.control{
    flex:0 0 25px;
    height:25px;
    display:grid;
    grid-template-columns:26px 1fr 26px;
    border:1px solid #d9dcdf;
    border-radius:5px;
    overflow:hidden;
}

.control button{
    border:0;
    background:#f0f2f3;
    color:#222;
    font-size:19px;
    font-weight:900;
    transition:transform .07s,background .07s,box-shadow .07s;
}

.control button:active{
    transform:scale(.84);
    background:#cfe5f8;
    box-shadow:inset 0 0 7px rgba(0,0,0,.22);
}

.quantity{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-size:15px;
    font-weight:900;
}

/* MENU */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.40);
    z-index:100;
    display:none;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;
    top:0;
    left:-285px;
    width:285px;
    height:100%;
    background:#fff;
    z-index:200;
    transition:left .22s ease;
    box-shadow:4px 0 15px rgba(0,0,0,.25);
}

.side-menu.open{
    left:0;
}

.side-title{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 15px;
    background:#087bd1;
    color:#fff;
    font-size:19px;
    font-weight:900;
}

.side-item{
    padding:14px 15px;
    border-bottom:1px solid #e8e8e8;
    font-size:14px;
}

/* SETTINGS */

.setting-panel{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:#f1f3f5;
}

.setting-header{
    height:48px;
    background:#087bd1;
    color:#fff;
    display:flex;
    align-items:center;
    font-size:18px;
    font-weight:900;
}

.back{
    width:45px;
    height:45px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:32px;
}

.setting-content{
    padding:10px;
}

.setting-box{
    background:#fff;
    border-radius:9px;
    padding:15px;
    margin-bottom:8px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.setting-label{
    font-size:14px;
    font-weight:800;
}

.volume-number{
    color:#087bd1;
    font-size:23px;
    font-weight:900;
}

input[type="range"]{
    width:100%;
    margin-top:10px;
}

/* DARK */

body.dark{
    background:#17191c;
    color:#f1f3f4;
}

body.dark .app{
    background:#17191c;
}

body.dark .total-box,
body.dark .report-box,
body.dark .money-card{
    background:#23272a;
    box-shadow:0 2px 7px rgba(0,0,0,.38);
}

body.dark .total-label,
body.dark .today-label,
body.dark .report-title,
body.dark .total-count{
    color:#999;
}

body.dark .total-money,
body.dark .today-number,
body.dark .report-value,
body.dark .money-total{
    color:#6bbcff;
}

body.dark .today-box{
    border-color:#3b3f43;
}

body.dark .money-title{
    color:#f1f3f4;
}

body.dark .extra-btn{
    background:#293d4d;
    color:#7cc3f5;
}

body.dark .control{
    border-color:#3d4246;
}

body.dark .control button{
    background:#303438;
    color:#fff;
}

body.dark .quantity{
    background:#24282b;
    color:#fff;
}

body.dark .side-menu,
body.dark .setting-panel{
    background:#202326;
}

body.dark .side-item{
    color:#fff;
    border-color:#383c40;
}

body.dark .setting-box{
    background:#292d30;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <button class="menu-btn" onclick="openMenu()">☰</button>

        <div class="header-title">
            হাফেজ তিজারা
        </div>

        <button class="more-btn" onclick="openMenu()">⋮</button>

    </div>


    <div class="total-box">

        <div>

            <div class="total-label">
                সর্বমোট টাকা
            </div>

            <div class="total-money" id="grandTotal">
                ৳ ০
            </div>

            <div class="total-count" id="grandCount">
                মোট ০ টি
            </div>

        </div>


        <div class="today-box">

            <div class="today-label">
                আজকের বিক্রি
            </div>

            <div class="today-number" id="todayCount">
                ০ টি
            </div>

        </div>

    </div>


    <div class="report-grid">

        <div class="report-box">
            <div class="report-title">আজ</div>
            <div class="report-value" id="today">৳ ০</div>
        </div>

        <div class="report-box">
            <div class="report-title">৭ দিন</div>
            <div class="report-value" id="week">৳ ০</div>
        </div>

        <div class="report-box">
            <div class="report-title">১ মাস</div>
            <div class="report-value" id="month">৳ ০</div>
        </div>

        <div class="report-box">
            <div class="report-title">১ বছর</div>
            <div class="report-value" id="year">৳ ০</div>
        </div>

    </div>


    <div class="extra-row">

        <button class="extra-btn" onclick="addExtra(1)">১</button>
        <button class="extra-btn" onclick="addExtra(2)">২</button>
        <button class="extra-btn" onclick="addExtra(3)">৩</button>
        <button class="extra-btn" onclick="addExtra(4)">৪</button>
        <button class="extra-btn" onclick="addExtra(5)">৫</button>

    </div>


    <div class="money-grid" id="moneyGrid"></div>

</div>


<div class="overlay" id="overlay" onclick="closeMenu()"></div>


<div class="side-menu" id="sideMenu">

    <div class="side-title">
        হাফেজ তিজারা
    </div>

    <div class="side-item" onclick="openSettings()">
        ⚙️ সেটিংস
    </div>

    <div class="side-item" onclick="toggleTheme()">
        🌙 / ☀️ থিম পরিবর্তন
    </div>

    <div class="side-item" onclick="toggleSound()">
        🔊 সাউন্ড চালু / বন্ধ
    </div>

    <div class="side-item" onclick="resetAll()">
        🗑️ সব হিসাব মুছুন
    </div>

</div>


<div class="setting-panel" id="settingPanel">

    <div class="setting-header">

        <button class="back" onclick="closeSettings()">
            ‹
        </button>

        সেটিংস

    </div>


    <div class="setting-content">

        <div class="setting-box">

            <div class="setting-label">
                🔊 সাউন্ড ভলিউম
            </div>

            <div class="volume-number">
                <span id="volumeText">৭০</span>%
            </div>

            <input
                id="volumeSlider"
                type="range"
                min="1"
                max="100"
                value="70"
                oninput="changeVolume(this.value)"
            >

        </div>


        <div
            class="setting-box"
            onclick="toggleSound()">

            🔊 সাউন্ড চালু / বন্ধ

        </div>


        <div
            class="setting-box"
            onclick="toggleTheme()">

            🌙 ডার্ক / ☀️ লাইট থিম

        </div>

    </div>

</div>


<script>

/* ==========================================
   DATA
========================================== */

const prices=[];

for(let i=5;i<=100;i+=5){
    prices.push(i);
}

let quantities=
    JSON.parse(
        localStorage.getItem("hafiz_quantities")
    ) || {};

let extras=
    JSON.parse(
        localStorage.getItem("hafiz_extras")
    ) || {};

let history=
    JSON.parse(
        localStorage.getItem("hafiz_history")
    ) || {};

let soundEnabled=
    localStorage.getItem("hafiz_sound")
    !=="off";

let volume=
    Number(
        localStorage.getItem("hafiz_volume")
    ) || 70;


/* ==========================================
   AUDIO
   প্রতিটি ক্লিকের জন্য নতুন AudioContext
   নয়—একই context, কিন্তু প্রতিটি ক্লিকে
   আলাদা oscillator তৈরি হবে।
========================================== */

let audioContext=null;

function getAudio(){

    if(!audioContext){

        audioContext=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}


function playClick(type){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx=getAudio();

        const oscillator=
            ctx.createOscillator();

        const gain=
            ctx.createGain();


        oscillator.connect(gain);
        gain.connect(
            ctx.destination
        );


        /*
          PLUS = উঁচু টোন
          MINUS = নিচু টোন
        */

        if(type==="plus"){

            oscillator.type="sine";

            oscillator.frequency.setValueAtTime(
                620,
                ctx.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                820,
                ctx.currentTime+0.045
            );

        }else{

            oscillator.type="triangle";

            oscillator.frequency.setValueAtTime(
                360,
                ctx.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                220,
                ctx.currentTime+0.055
            );

        }


        const v=
            Math.max(
                0.001,
                volume/100
            ) * 0.13;


        gain.gain.setValueAtTime(
            0.0001,
            ctx.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            v,
            ctx.currentTime+0.006
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime+0.085
        );


        oscillator.start(
            ctx.currentTime
        );

        oscillator.stop(
            ctx.currentTime+0.09
        );

    }catch(e){

        console.log(e);

    }

}


/* ==========================================
   VOLUME
========================================== */

function changeVolume(value){

    volume=Number(value);

    localStorage.setItem(
        "hafiz_volume",
        volume
    );

    document.getElementById(
        "volumeText"
    ).innerText=volume;

}


/* ==========================================
   SOUND
========================================== */

function toggleSound(){

    soundEnabled=!soundEnabled;

    localStorage.setItem(
        "hafiz_sound",
        soundEnabled?"on":"off"
    );

}


/* ==========================================
   BANGLA NUMBER
========================================== */

function bn(n){

    return Number(n)
        .toLocaleString("bn-BD");

}


/* ==========================================
   DATE
========================================== */

function todayKey(){

    const d=new Date();

    return d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+
        String(d.getDate()).padStart(2,"0");

}


/* ==========================================
   SAVE
========================================== */

function save(){

    localStorage.setItem(
        "hafiz_quantities",
        JSON.stringify(quantities)
    );

    localStorage.setItem(
        "hafiz_extras",
        JSON.stringify(extras)
    );

    localStorage.setItem(
        "hafiz_history",
        JSON.stringify(history)
    );

}


/* ==========================================
   RECORD
========================================== */

function record(amount){

    const day=todayKey();

    if(!history[day]){
        history[day]=[];
    }

    history[day].push({
        amount:Number(amount),
        time:Date.now()
    });

}


/* ==========================================
   PLUS
========================================== */

function plus(price){

    /*
       সাউন্ড প্রথমে।
       তাই দ্রুত পরপর ক্লিক করলেও
       প্রতিটি ক্লিকের নিজস্ব sound হবে।
    */

    playClick("plus");

    quantities[price]=
        Number(quantities[price]||0)+1;

    record(price);

    save();

    render();

}


/* ==========================================
   MINUS
========================================== */

function minus(price){

    if(
        Number(quantities[price]||0)<=0
    ){
        return;
    }

    playClick("minus");

    quantities[price]--;

    record(-price);

    save();

    render();

}


/* ==========================================
   1-5
========================================== */

function addExtra(value){

    playClick("plus");

    extras[value]=
        Number(extras[value]||0)+1;

    record(value);

    save();

    render();

}


/* ==========================================
   TOTAL
========================================== */

function totalAmount(){

    let total=0;

    prices.forEach(price=>{

        total +=
            price*
            Number(
                quantities[price]||0
            );

    });

    for(let i=1;i<=5;i++){

        total +=
            i*
            Number(
                extras[i]||0
            );

    }

    return total;

}


/* ==========================================
   COUNT
========================================== */

function totalCount(){

    let count=0;

    prices.forEach(price=>{

        count +=
            Number(
                quantities[price]||0
            );

    });

    for(let i=1;i<=5;i++){

        count +=
            Number(
                extras[i]||0
            );

    }

    return count;

}


/* ==========================================
   TODAY COUNT
========================================== */

function todayCount(){

    const h=
        history[todayKey()]||[];

    return h.filter(
        x=>Number(x.amount)>0
    ).length;

}


/* ==========================================
   PERIOD
========================================== */

function periodTotal(days){

    let total=0;

    const now=new Date();

    const start=new Date(now);

    start.setHours(0,0,0,0);

    start.setDate(
        start.getDate()-days
    );

    Object.keys(history)
        .forEach(day=>{

            const d=
                new Date(
                    day+"T00:00:00"
                );

            if(d>=start){

                history[day].forEach(x=>{

                    total+=Number(x.amount);

                });

            }

        });

    return Math.max(0,total);

}


/* ==========================================
   RENDER
========================================== */

function render(){

    const grid=
        document.getElementById(
            "moneyGrid"
        );

    grid.innerHTML="";


    prices.forEach(price=>{

        const qty=
            Number(
                quantities[price]||0
            );

        const total=price*qty;

        const card=
            document.createElement("div");

        card.className="money-card";

        card.innerHTML=`

            <div class="money-title">
                ৳ ${bn(price)}
            </div>

            <div class="money-total">
                মোট ৳ ${bn(total)}
            </div>

            <div class="control">

                <button
                    onclick="minus(${price})">
                    −
                </button>

                <div class="quantity">
                    ${bn(qty)}
                </div>

                <button
                    onclick="plus(${price})">
                    +
                </button>

            </div>

        `;

        grid.appendChild(card);

    });


    document.getElementById(
        "grandTotal"
    ).innerText=
        "৳ "+bn(totalAmount());


    document.getElementById(
        "grandCount"
    ).innerText=
        "মোট "+bn(totalCount())+" টি";


    document.getElementById(
        "todayCount"
    ).innerText=
        bn(todayCount())+" টি";


    document.getElementById(
        "today"
    ).innerText=
        "৳ "+bn(periodTotal(0));


    document.getElementById(
        "week"
    ).innerText=
        "৳ "+bn(periodTotal(6));


    document.getElementById(
        "month"
    ).innerText=
        "৳ "+bn(periodTotal(29));


    document.getElementById(
        "year"
    ).innerText=
        "৳ "+bn(periodTotal(364));

}


/* ==========================================
   MENU
========================================== */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}

function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* ==========================================
   SETTINGS
========================================== */

function openSettings(){

    closeMenu();

    document.getElementById(
        "settingPanel"
    ).style.display="block";

    document.getElementById(
        "volumeSlider"
    ).value=volume;

    document.getElementById(
        "volumeText"
    ).innerText=volume;

}

function closeSettings(){

    document.getElementById(
        "settingPanel"
    ).style.display="none";

}


/* ==========================================
   THEME
========================================== */

function toggleTheme(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "hafiz_theme",
        document.body.classList.contains("dark")
            ?"dark"
            :"light"
    );

}


/* ==========================================
   RESET
========================================== */

function resetAll(){

    closeMenu();

    if(
        !confirm(
            "সব হিসাব মুছে ফেলবেন?"
        )
    ){
        return;
    }

    quantities={};
    extras={};
    history={};

    save();
    render();

}


/* ==========================================
   LOAD
========================================== */

function load(){

    if(
        localStorage.getItem(
            "hafiz_theme"
        )==="dark"
    ){

        document.body.classList.add("dark");

    }

    document.getElementById(
        "volumeSlider"
    ).value=volume;

    document.getElementById(
        "volumeText"
    ).innerText=volume;

    render();

}

load();

</script>

</body>
</html>
