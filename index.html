<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>হাফেজ তিজারাহ</title>

    <style>
        /* ==================================================
           GLOBAL / BASE
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #eef5fb;
            font-family: "Noto Sans Bengali", sans-serif;
        }


        /* ==================================================
           SECTION 01 — HOME SCREEN
        ================================================== */

        .home-screen {
            width: 100%;
            height: 100vh;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* ==================================================
           SECTION 02 — HEADER
        ================================================== */

        .home-header {
            position: relative;

            width: 100%;
            height: 170px;
            flex-shrink: 0;

            background:
                radial-gradient(
                    circle at 85% 20%,
                    rgba(255, 255, 255, 0.10),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0878df 0%,
                    #087bea 45%,
                    #168cf0 100%
                );

            border-radius: 0 0 38px 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 12px 28px rgba(0, 80, 160, 0.18);
        }


        /* ==================================================
           SECTION 03 — MENU BUTTON
        ================================================== */

        .menu-button {
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            width: 52px;
            height: 52px;

            border: none;
            outline: none;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 6px;

            cursor: pointer;

            z-index: 10;
        }


        .menu-button span {
            display: block;

            width: 25px;
            height: 3px;

            background: #ffffff;

            border-radius: 10px;

            transition: 0.18s ease;
        }


        /* ==================================================
           SECTION 04 — BRAND
        ================================================== */

        .home-brand {
            width: calc(100% - 100px);

            text-align: center;

            color: #ffffff;
        }


        .home-brand h1 {
            font-size: 29px;
            line-height: 1.2;

            font-weight: 800;

            white-space: nowrap;

            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.08);
        }


        .home-brand p {
            margin-top: 5px;

            font-size: 16px;
            line-height: 1.3;

            font-weight: 400;

            white-space: nowrap;
        }


        /* ==================================================
           SECTION 05 — HOME CONTENT AREA
        ================================================== */

        .home-content {
            flex: 1;

            width: 100%;

            padding: 14px 14px 12px;

            display: flex;
            flex-direction: column;

            gap: 10px;

            overflow: hidden;
        }


        /* ==================================================
           SECTION 06 — MONEY SUMMARY AREA
           
           এখানে পরবর্তীতে:
           Total Money
           Today's Transaction
           Pending Amount
           থাকবে।
        ================================================== */

        .money-summary-section {
            width: 100%;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;
        }


        /* ==================================================
           SECTION 07 — PLACEHOLDER CARDS
           
           এখন শুধু কাঠামো।
           পরের ধাপে এগুলোর Final Design হবে।
        ================================================== */

        .summary-card {
            min-height: 82px;

            padding: 12px;

            background: #ffffff;

            border-radius: 18px;

            box-shadow:
                0 6px 18px rgba(0, 70, 130, 0.08);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        .summary-card-title {
            font-size: 14px;
            font-weight: 600;

            color: #5d6b78;
        }


        .summary-card-value {
            margin-top: 5px;

            font-size: 22px;
            font-weight: 800;

            color: #0878df;
        }


        /* ==================================================
           SECTION 08 — PENDING AREA
        ================================================== */

        .pending-section {
            width: 100%;
        }


        .pending-card {
            width: 100%;
            min-height: 72px;

            padding: 12px 16px;

            background: #ffffff;

            border-radius: 18px;

            box-shadow:
                0 6px 18px rgba(0, 70, 130, 0.08);

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .pending-title {
            font-size: 15px;
            font-weight: 700;

            color: #5d6b78;
        }


        .pending-value {
            font-size: 22px;
            font-weight: 800;

            color: #0878df;
        }


        /* ==================================================
           SECTION 09 — QUICK AMOUNT AREA
           
           এখন শুধু জায়গা তৈরি করা হয়েছে।
           Functional Button পরের Section-এ হবে।
        ================================================== */

        .quick-amount-section {
            width: 100%;

            flex: 1;

            min-height: 0;

            display: flex;
            flex-direction: column;

            justify-content: flex-end;
        }


        .quick-amount-title {
            margin-bottom: 7px;

            font-size: 15px;
            font-weight: 700;

            color: #4d5b67;
        }


        .quick-amount-area {
            width: 100%;

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 7px;
        }


        .quick-amount-placeholder {
            height: 42px;

            border-radius: 13px;

            background: #ffffff;

            box-shadow:
                0 4px 12px rgba(0, 70, 130, 0.07);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;
            font-weight: 700;

            color: #0878df;
        }


        /* ==================================================
           SECTION 10 — MOBILE / SMALL SCREEN
        ================================================== */

        @media (max-width: 380px) {

            .home-header {
                height: 155px;
            }

            .home-brand {
                width: calc(100% - 90px);
            }

            .home-brand h1 {
                font-size: 25px;
            }

            .home-brand p {
                font-size: 14px;
            }

            .menu-button {
                left: 14px;

                width: 48px;
                height: 48px;
            }

            .summary-card {
                min-height: 72px;
            }

            .summary-card-value {
                font-size: 20px;
            }

            .quick-amount-area {
                gap: 5px;
            }

            .quick-amount-placeholder {
                height: 38px;

                font-size: 12px;
            }
        }


        /* ==================================================
           SECTION 11 — MENU ANIMATION
        ================================================== */

        .menu-button.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-button.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

    </style>
</head>


<body>


    <!-- ==================================================
         SECTION 01 — HOME SCREEN
    ================================================== -->

    <main class="home-screen">


        <!-- ==================================================
             SECTION 02 — HEADER
        ================================================== -->

        <header class="home-header">


            <!-- ==================================================
                 SECTION 03 — MENU BUTTON
            ================================================== -->

            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <!-- ==================================================
                 SECTION 04 — BRAND
            ================================================== -->

            <div class="home-brand">

                <h1>হাফেজ তিজারাহ</h1>

                <p>পরিবারের নিত্যদিনের বাজার</p>

            </div>

        </header>



        <!-- ==================================================
             SECTION 05 — HOME CONTENT
        ================================================== -->

        <section class="home-content">


            <!-- ==================================================
                 SECTION 06 — MONEY SUMMARY
            ================================================== -->

            <section class="money-summary-section">


                <!-- TOTAL MONEY -->

                <div class="summary-card">

                    <div class="summary-card-title">
                        সর্বমোট টাকা
                    </div>

                    <div class="summary-card-value">
                        ৳0
                    </div>

                </div>


                <!-- TODAY TRANSACTION -->

                <div class="summary-card">

                    <div class="summary-card-title">
                        আজকের মোট লেনদেন
                    </div>

                    <div class="summary-card-value">
                        ৳0
                    </div>

                </div>

            </section>



            <!-- ==================================================
                 SECTION 08 — PENDING
            ================================================== -->

            <section class="pending-section">

                <div class="pending-card">

                    <div class="pending-title">
                        Pending Amount
                    </div>

                    <div class="pending-value">
                        ৳0
                    </div>

                </div>

            </section>



            <!-- ==================================================
                 SECTION 09 — QUICK AMOUNT
            ================================================== -->

            <section class="quick-amount-section">

                <div class="quick-amount-title">
                    Quick Amount
                </div>


                <div class="quick-amount-area">

                    <div class="quick-amount-placeholder">৳5</div>
                    <div class="quick-amount-placeholder">৳10</div>
                    <div class="quick-amount-placeholder">৳15</div>
                    <div class="quick-amount-placeholder">৳20</div>
                    <div class="quick-amount-placeholder">৳25</div>

                    <div class="quick-amount-placeholder">৳30</div>
                    <div class="quick-amount-placeholder">৳40</div>
                    <div class="quick-amount-placeholder">৳50</div>
                    <div class="quick-amount-placeholder">৳75</div>
                    <div class="quick-amount-placeholder">৳100</div>

                </div>

            </section>


        </section>

    </main>



    <!-- ==================================================
         SECTION 12 — JAVASCRIPT
    ================================================== -->

    <script>

        const menuButton =
            document.getElementById("menuButton");


        menuButton.addEventListener("click", function () {

            this.classList.toggle("active");

        });

    </script>


</body>
</html>
