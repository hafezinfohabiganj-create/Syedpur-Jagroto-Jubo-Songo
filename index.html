<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>হাফেজ তিজারা</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#f1f3f5;
    --card:#ffffff;
    --card2:#f7f8fa;
    --text:#18202a;
    --muted:#747b84;
    --primary:#1785d1;
    --primary2:#0d6fba;
    --border:#dfe3e7;
    --danger:#e74c3c;
    --success:#22a06b;
    --shadow:0 2px 8px rgba(0,0,0,.08);
}

body.dark{
    --bg:#171a1d;
    --card:#222629;
    --card2:#292e32;
    --text:#f2f4f5;
    --muted:#9da4aa;
    --primary:#4aa8ed;
    --primary2:#268cd2;
    --border:#3a4045;
    --danger:#ff6b5c;
    --success:#39c58b;
    --shadow:0 2px 10px rgba(0,0,0,.35);
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
      "Noto Sans Bengali",
      "Nirmala UI",
      Arial,
      sans-serif;
    background:var(--bg);
    color:var(--text);
}

button{
    font-family:inherit;
    border:0;
    outline:0;
    cursor:pointer;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100dvh;
    max-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    height:52px;
    min-height:52px;
    background:var(--primary);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    z-index:10;
}

.header-title{
    font-size:23px;
    font-weight:800;
    text-align:center;
    flex:1;
    white-space:nowrap;
}

.header-btn{
    width:42px;
    height:42px;
    background:transparent;
    color:white;
    font-size:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
}

.header-btn:active{
    background:rgba(255,255,255,.18);
    transform:scale(.92);
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:7px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

/* =========================
   TOTAL AREA
========================= */

.top-summary{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    min-height:68px;
    display:grid;
    grid-template-columns:1.4fr 1fr;
    overflow:hidden;
}

.total-box{
    padding:6px 12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
}

.total-label{
    color:var(--muted);
    font-size:12px;
    line-height:1;
}

.total-value{
    color:var(--primary);
    font-size:28px;
    line-height:1.1;
    font-weight:900;
    white-space:nowrap;
}

.total-count{
    color:var(--muted);
    font-size:10px;
}

.sales-box{
    border-left:1px solid var(--border);
    padding:6px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.sales-item{
    text-align:center;
    min-width:0;
}

.sales-label{
    color:var(--muted);
    font-size:10px;
}

.sales-value{
    color:var(--primary);
    font-weight:900;
    font-size:18px;
}

/* =========================
   PERIOD BUTTONS
========================= */

.periods{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    min-height:43px;
}

.period-btn{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--muted);
    padding:3px 2px;
    box-shadow:var(--shadow);
    transition:.15s;
    min-width:0;
}

.period-btn span{
    display:block;
    font-size:9px;
    line-height:1.1;
}

.period-btn strong{
    display:block;
    color:var(--primary);
    font-size:14px;
    line-height:1.2;
}

.period-btn.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.period-btn.active strong{
    color:white;
}

.period-btn:active{
    transform:scale(.95);
}

/* =========================
   INSTANT TRANSACTION
========================= */

.instant{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    min-height:58px;
    padding:5px 7px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
}

.instant-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
}

.instant-title{
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.instant-title::before{
    content:"⚡ ";
}

.pending-info{
    color:var(--primary);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.instant-bottom{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
}

.pending-list{
    flex:1;
    min-width:0;
    height:28px;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:4px;
}

.pending-empty{
    color:var(--muted);
    font-size:9px;
}

.pending-chip{
    height:27px;
    min-width:58px;
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:4px;
    padding:0 5px;
    flex-shrink:0;
}

.pending-amount{
    color:var(--primary);
    font-size:11px;
    font-weight:900;
}

.chip-delete{
    width:20px;
    height:20px;
    border-radius:5px;
    background:rgba(231,76,60,.12);
    color:var(--danger);
    font-size:12px;
}

.commit-all{
    height:28px;
    padding:0 9px;
    border-radius:7px;
    background:var(--success);
    color:white;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.commit-all:active,
.chip-delete:active{
    transform:scale(.9);
}

/* =========================
   QUICK NUMBERS
========================= */

.quick{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    min-height:32px;
}

.quick-btn{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--primary);
    border-radius:8px;
    font-size:16px;
    font-weight:900;
    box-shadow:var(--shadow);
    transition:.1s;
}

.quick-btn:active,
.money-btn:active,
.control-btn:active{
    transform:scale(.92);
    box-shadow:
      inset 0 1px 4px rgba(0,0,0,.2),
      0 0 0 2px rgba(23,133,209,.18);
}

/* =========================
   MONEY GRID
========================= */

.money-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:5px;
}

.money-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:5px 4px;
    overflow:hidden;
}

.money-name{
    color:var(--text);
    font-weight:900;
    font-size:17px;
    line-height:1.05;
    white-space:nowrap;
}

.money-total{
    color:var(--primary);
    font-size:10px;
    font-weight:800;
    line-height:1;
    white-space:nowrap;
}

.controls{
    width:100%;
    height:29px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    background:var(--card2);
}

.control-btn{
    background:transparent;
    color:var(--text);
    font-size:19px;
    font-weight:900;
    transition:.08s;
}

.control-btn.minus{
    background:rgba(0,0,0,.035);
}

.control-btn.plus{
    background:rgba(23,133,209,.08);
    color:var(--primary);
}

.count{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:900;
    color:var(--text);
}

/* =========================
   SETTINGS PANEL
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.settings{
    width:100%;
    background:var(--card);
    border-radius:18px 18px 0 0;
    padding:15px;
    box-shadow:0 -5px 25px rgba(0,0,0,.3);
}

.settings h3{
    margin:0 0 12px;
    font-size:18px;
}

.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-label{
    font-size:13px;
    font-weight:700;
}

.range-wrap{
    display:flex;
    align-items:center;
    gap:7px;
}

input[type=range]{
    width:130px;
}

.volume-value{
    width:40px;
    text-align:right;
    color:var(--primary);
    font-weight:900;
}

.theme-btn{
    padding:7px 12px;
    border-radius:8px;
    background:var(--primary);
    color:white;
    font-size:11px;
    font-weight:800;
}

.close-settings{
    width:100%;
    margin-top:12px;
    height:38px;
    border-radius:9px;
    background:var(--card2);
    color:var(--text);
    font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:360px){
    .header{
        height:48px;
        min-height:48px;
    }

    .header-title{
        font-size:20px;
    }

    .main{
        padding:5px;
        gap:4px;
    }

    .top-summary{
        min-height:61px;
    }

    .total-value{
        font-size:25px;
    }

    .periods{
        min-height:39px;
    }

    .period-btn strong{
        font-size:12px;
    }

    .instant{
        min-height:53px;
    }

    .money-name{
        font-size:15px;
    }

    .money-total{
        font-size:9px;
    }

    .controls{
        height:26px;
    }

    .control-btn{
        font-size:17px;
    }

    .count{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <button class="header-btn" id="menuBtn">☰</button>

        <div class="header-title">
            হাফেজ তিজারা
        </div>

        <button class="header-btn" id="settingsBtn">⋮</button>

    </header>


    <main class="main">

        <!-- TOTAL + TODAY -->
        <section class="top-summary">

            <div class="total-box">
                <div class="total-label">সর্বমোট টাকা</div>

                <div class="total-value" id="grandTotal">
                    ৳ ০
                </div>

                <div class="total-count" id="grandCount">
                    মোট ০ টি
                </div>
            </div>

            <div class="sales-box">

                <div class="sales-item">
                    <div class="sales-label">আজকের বিক্রি</div>
                    <div class="sales-value" id="todayTotal">
                        ৳ ০
                    </div>
                </div>

                <div class="sales-item">
                    <div class="sales-label">লেনদেন</div>
                    <div class="sales-value" id="todayCount">
                        ০
                    </div>
                </div>

            </div>

        </section>


        <!-- PERIOD -->
        <section class="periods">

            <button class="period-btn active" data-days="1">
                <span>আজ</span>
                <strong id="p1">৳০</strong>
            </button>

            <button class="period-btn" data-days="7">
                <span>৭ দিন</span>
                <strong id="p7">৳০</strong>
            </button>

            <button class="period-btn" data-days="15">
                <span>১৫ দিন</span>
                <strong id="p15">৳০</strong>
            </button>

            <button class="period-btn" data-days="30">
                <span>১ মাস</span>
                <strong id="p30">৳০</strong>
            </button>

            <button class="period-btn" data-days="365">
                <span>১ বছর</span>
                <strong id="p365">৳০</strong>
            </button>

        </section>


        <!-- INSTANT TRANSACTION -->
        <section class="instant">

            <div class="instant-top">

                <div class="instant-title">
                    ইনস্ট্যান্ট লেনদেন
                </div>

                <div class="pending-info" id="pendingInfo">
                    পেন্ডিং: ০ | ৳০
                </div>

            </div>


            <div class="instant-bottom">

                <div class="pending-list" id="pendingList">

                    <div class="pending-empty">
                        এখন কোনো পেন্ডিং লেনদেন নেই
                    </div>

                </div>

                <button class="commit-all" id="commitAll">
                    ✓ মোট টাকায় যোগ
                </button>

            </div>

        </section>


        <!-- QUICK 1-5 -->
        <section class="quick">

            <button class="quick-btn" data-extra="1">১</button>
            <button class="quick-btn" data-extra="2">২</button>
            <button class="quick-btn" data-extra="3">৩</button>
            <button class="quick-btn" data-extra="৪">৪</button>
            <button class="quick-btn" data-extra="৫">৫</button>

        </section>


        <!-- MONEY -->
        <section class="money-grid" id="moneyGrid"></section>

    </main>

</div>


<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">

    <div class="settings">

        <h3>⚙ সেটিংস</h3>

        <div class="setting-row">

            <div class="setting-label">
                সাউন্ড ভলিউম
            </div>

            <div class="range-wrap">

                <input
                    type="range"
                    id="volumeRange"
                    min="1"
                    max="100"
                    value="100"
                >

                <div class="volume-value" id="volumeValue">
                    100%
                </div>

            </div>

        </div>


        <div class="setting-row">

            <div class="setting-label">
                থিম
            </div>

            <button class="theme-btn" id="themeBtn">
                🌙 ডার্ক মোড
            </button>

        </div>


        <button class="close-settings" id="closeSettings">
            বন্ধ করুন
        </button>

    </div>

</div>


<script>
/* =========================================================
   HAFEZ TIJARA
   COMPLETE APP JAVASCRIPT
========================================================= */


/* =========================
   BANGLA NUMBER
========================= */

const bn = [
    "০","১","২","৩","৪","৫","৬","৭","৮","৯"
];

function bnNumber(number){

    number = Math.round(Number(number) || 0);

    return String(number)
        .replace(/[0-9]/g, d => bn[d]);

}


/* =========================
   MONEY VALUES
========================= */

const moneyValues = [];

for(let i = 5; i <= 100; i += 5){
    moneyValues.push(i);
}


/* =========================
   DATA
========================= */

let data = JSON.parse(
    localStorage.getItem("hafezTijaraData") || "{}"
);

if(!data.sales){
    data.sales = [];
}

if(!data.counts){
    data.counts = {};
}

moneyValues.forEach(v => {

    if(typeof data.counts[v] !== "number"){
        data.counts[v] = 0;
    }

});


let pending = JSON.parse(
    localStorage.getItem("hafezTijaraPending") || "[]"
);

let volume =
    Number(localStorage.getItem("hafezTijaraVolume") || 100);

let dark =
    localStorage.getItem("hafezTijaraDark") === "true";


/* =========================
   SAVE
========================= */

function saveData(){

    localStorage.setItem(
        "hafezTijaraData",
        JSON.stringify(data)
    );

    localStorage.setItem(
        "hafezTijaraPending",
        JSON.stringify(pending)
    );

}


/* =========================
   DATE
========================= */

function todayStart(){

    const d = new Date();

    d.setHours(0,0,0,0);

    return d.getTime();

}


function periodTotal(days){

    const now = Date.now();

    const start =
        now - (days * 24 * 60 * 60 * 1000);

    return data.sales
        .filter(x => x.time >= start)
        .reduce((sum,x) => sum + x.amount,0);

}


function periodCount(days){

    const now = Date.now();

    const start =
        now - (days * 24 * 60 * 60 * 1000);

    return data.sales
        .filter(x => x.time >= start)
        .length;

}


/* =========================
   FORMAT MONEY
========================= */

function money(amount){

    return "৳ " + bnNumber(amount);

}


/* =========================
   AUDIO SYSTEM
========================= */

let audioContext = null;


function getAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioCtx){
            audioContext = new AudioCtx();
        }

    }

    return audioContext;

}


/*
   + SOUND
   পরিষ্কার ও একটু জোরালো
*/

function plusSound(){

    const ctx = getAudio();

    if(!ctx) return;

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        620,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        940,
        now + .08
    );

    const loud =
        Math.min(0.55, 0.55 * (volume / 100));

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        loud,
        now + .012
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + .18
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .2);

}


/*
   - SOUND
   নিচের দিকে নামা টোন
*/

function minusSound(){

    const ctx = getAudio();

    if(!ctx) return;

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "triangle";

    osc.frequency.setValueAtTime(
        430,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        210,
        now + .13
    );

    const loud =
        Math.min(0.55, 0.55 * (volume / 100));

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        loud,
        now + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + .2
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + .22);

}


/*
   লেনদেন মোট টাকায় যোগ
*/

function commitSound(){

    const ctx = getAudio();

    if(!ctx) return;

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    [520,700,900].forEach((freq,i)=>{

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";

        osc.frequency.value = freq;

        const start =
            now + (i * .055);

        const loud =
            Math.min(0.65,0.65*(volume/100));

        gain.gain.setValueAtTime(
            0.001,
            start
        );

        gain.gain.exponentialRampToValueAtTime(
            loud,
            start + .015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            start + .16
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(start);
        osc.stop(start+.18);

    });

}


/*
   DELETE SOUND
   ভাঙা/ক্র্যাকের মতো ছোট sound
*/

function deleteSound(){

    const ctx = getAudio();

    if(!ctx) return;

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
        300,
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        90,
        now+.14
    );

    const loud =
        Math.min(0.48,0.48*(volume/100));

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        loud,
        now+.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now+.15
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now+.17);

}


/* =========================
   RENDER MONEY GRID
========================= */

const moneyGrid =
    document.getElementById("moneyGrid");


function renderMoneyGrid(){

    moneyGrid.innerHTML = "";

    moneyValues.forEach(value => {

        const card =
            document.createElement("div");

        card.className = "money-card";

        card.innerHTML = `

            <div class="money-name">
                ৳ ${bnNumber(value)}
            </div>

            <div class="money-total">
                মোট ৳ ${bnNumber(data.counts[value] * value)}
            </div>

            <div class="controls">

                <button
                    class="control-btn minus"
                    data-value="${value}"
                    data-action="minus">
                    −
                </button>

                <div
                    class="count"
                    id="count-${value}">
                    ${bnNumber(data.counts[value])}
                </div>

                <button
                    class="control-btn plus"
                    data-value="${value}"
                    data-action="plus">
                    +
                </button>

            </div>

        `;

        moneyGrid.appendChild(card);

    });

}


/* =========================
   MONEY BUTTON EVENT
========================= */

moneyGrid.addEventListener(
    "click",
    function(e){

        const button =
            e.target.closest(".control-btn");

        if(!button) return;

        const value =
            Number(button.dataset.value);

        const action =
            button.dataset.action;


        if(action === "plus"){

            /*
               Plus চাপলে:
               ১টি পণ্য বিক্রি হিসেবে pending-এ যাবে।
               এখনই মোট টাকায় যোগ হবে না।
            */

            pending.push({
                amount:value,
                time:Date.now()
            });

            data.counts[value]++;

            plusSound();

            saveData();

            renderAll();

        }


        if(action === "minus"){

            /*
               Minus:
               আগে ঐ denomination-এর count কমাবে।
               তারপর pending থেকে সর্বশেষ matching transaction
               সরাবে।
            */

            if(data.counts[value] <= 0){
                return;
            }

            data.counts[value]--;

            const index =
                [...pending]
                .map((x,i)=>({x,i}))
                .reverse()
                .find(obj =>
                    obj.x.amount === value
                );

            if(index){
                pending.splice(index.i,1);
            }

            minusSound();

            saveData();

            renderAll();

        }

    }
);


/* =========================
   QUICK 1-5
========================= */

document.querySelectorAll(
    ".quick-btn"
).forEach(button => {

    button.addEventListener(
        "click",
        function(){

            const extra =
                Number(
                    this.dataset.extra
                );

            /*
               সর্বশেষ pending transaction-এর সাথে
               ১-৫ টাকা যোগ হবে।

               যেমন:
               ১০ + ৩ = ১৩
               ৯০ + ২ = ৯২
            */

            if(pending.length === 0){

                /*
                   যদি আগে কোনো base amount না থাকে,
                   তাহলে সরাসরি extra amount pending হবে।
                */

                pending.push({
                    amount:extra,
                    time:Date.now()
                });

            }else{

                const last =
                    pending[pending.length - 1];

                last.amount += extra;

            }

            plusSound();

            saveData();

            renderAll();

        }
    );

});


/* =========================
   PENDING RENDER
========================= */

const pendingList =
    document.getElementById("pendingList");

const pendingInfo =
    document.getElementById("pendingInfo");


function renderPending(){

    const total =
        pending.reduce(
            (sum,x)=>sum+x.amount,
            0
        );

    pendingInfo.textContent =
        "পেন্ডিং: " +
        bnNumber(pending.length) +
        " | " +
        money(total);


    pendingList.innerHTML = "";


    if(pending.length === 0){

        pendingList.innerHTML = `
            <div class="pending-empty">
                এখন কোনো পেন্ডিং লেনদেন নেই
            </div>
        `;

        return;

    }


    /*
       সবগুলো transaction এক লাইনে।
       জায়গা কম হলে প্রথম কয়েকটি দেখাবে।
    */

    pending.slice(0,8).forEach(
        (item,index)=>{

            const chip =
                document.createElement("div");

            chip.className =
                "pending-chip";

            chip.innerHTML = `

                <span class="pending-amount">
                    ${money(item.amount)}
                </span>

                <button
                    class="chip-delete"
                    data-index="${index}">
                    ×
                </button>

            `;

            pendingList.appendChild(chip);

        }
    );


    if(pending.length > 8){

        const more =
            document.createElement("div");

        more.className =
            "pending-chip";

        more.innerHTML = `
            <span class="pending-amount">
                +${bnNumber(pending.length-8)}
            </span>
        `;

        pendingList.appendChild(more);

    }

}


/* =========================
   DELETE PENDING
========================= */

pendingList.addEventListener(
    "click",
    function(e){

        const btn =
            e.target.closest(".chip-delete");

        if(!btn) return;

        const index =
            Number(btn.dataset.index);

        const removed =
            pending[index];

        if(!removed) return;


        /*
           denomination count-ও ঠিক করা হবে।
        */

        if(
            data.counts[removed.amount] !== undefined &&
            data.counts[removed.amount] > 0
        ){

            data.counts[removed.amount]--;

        }


        pending.splice(index,1);

        deleteSound();

        saveData();

        renderAll();

    }
);


/* =========================
   COMMIT ALL
========================= */

document.getElementById(
    "commitAll"
).addEventListener(
    "click",
    function(){

        if(pending.length === 0){

            return;

        }


        /*
           সব pending transaction
           মোট হিসাবের মধ্যে যাবে।
        */

        pending.forEach(item => {

            data.sales.push({

                amount:item.amount,

                time:Date.now()

            });

        });


        pending = [];

        commitSound();

        saveData();

        renderAll();

    }
);

   SUMMARY RENDER

/* =========================
   PERIOD ACTIVE
========================= */

document.querySelectorAll(
    ".period-btn"
).forEach(button => {

    button.addEventListener(
        "click",

            document.querySelectorAll(

}


/* =========================

========================= */

    document.getElementById(
        "settingsOverlay"
    );

    document.getElementById(
        "volumeRange"

        "volumeValue"

).addEventListener(

   VOLUME
========================= */

volumeRange.addEventListener(

    function(){

            Number(this.value);

        volumeValue.textContent =

        localStorage.setItem(
            "hafezTijaraVolume",

        );

    }
);


/* =========================
   THEME
========================= */

const themeBtn =
    document.getElementById(
        "themeBtn"
    );


function updateTheme(){

    document.body.classList.toggle(
        "dark",
        dark
    );

    themeBtn.textContent =
        dark
        ? "☀️ লাইট মোড"
        : "🌙 ডার্ক মোড";

}


themeBtn.addEventListener(
    "click",
    function(){

        dark = !dark;

        localStorage.setItem(
            "hafezTijaraDark",
            dark
        );

        updateTheme();

    }
);


/* =========================
   MENU BUTTON
========================= */

document.getElementById(
    "menuBtn"
).addEventListener(
    "click",
    function(){

        overlay.classList.add("show");

    }
);


/* =========================
   START
========================= */

updateTheme();

renderAll();


/* =========================
   PREVENT DOUBLE TAP ZOOM
========================= */

let lastTouch = 0;

document.addEventListener(
    "touchend",
    function(e){

        const now = Date.now();

        if(now-lastTouch <= 300){

            e.preventDefault();

        }

        lastTouch = now;

    },
    {passive:false}
);

</script>
