<!-- =========================
     HOME SCREEN
========================= -->

<div id="homeScreen" class="screen">

  <!-- Header -->
  <header class="app-header">
    <button class="menu-btn">☰</button>

    <div class="app-title">
      <h1>হাফেজ তিজারাহ</h1>
      <p>পরিবারের নিত্যদিনের বাজার</p>
    </div>

    <button class="settings-btn" onclick="openSettings()">⚙</button>
  </header>


  <!-- Summary -->
  <section class="summary">

    <div class="summary-card">
      <span>সর্বমোট টাকা</span>
      <strong>৳ ১,২৫০</strong>
      <span>💳</span>
    </div>

    <div class="summary-card">
      <span>আজকের লেনদেন</span>
      <strong>২৩</strong>
      <span>📋</span>
    </div>

  </section>


  <!-- Pending Amount -->
  <section class="pending-box">

    <div>
      <small>Pending Amount</small>
      <h2>৳ ৩৬০</h2>
    </div>

    <button class="add-total">
      ✓ মোট টাকায় যোগ
    </button>

    <button class="cancel-btn">
      ✕
    </button>

  </section>


  <!-- Quick Number -->
  <div class="number-row">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
  </div>


  <!-- Quick Amount -->
  <section class="amount-grid">

    <button>5<br><small>৳ 5</small></button>
    <button>10<br><small>৳ 10</small></button>
    <button>15<br><small>৳ 15</small></button>

    <button>20<br><small>৳ 20</small></button>
    <button>25<br><small>৳ 25</small></button>
    <button>30<br><small>৳ 30</small></button>

    <button>35<br><small>৳ 35</small></button>
    <button>40<br><small>৳ 40</small></button>
    <button>45<br><small>৳ 45</small></button>

    <button>50<br><small>৳ 50</small></button>
    <button>55<br><small>৳ 55</small></button>
    <button>60<br><small>৳ 60</small></button>

    <button>65<br><small>৳ 65</small></button>
    <button>70<br><small>৳ 70</small></button>
    <button>75<br><small>৳ 75</small></button>

    <button>80<br><small>৳ 80</small></button>
    <button>85<br><small>৳ 85</small></button>
    <button>90<br><small>৳ 90</small></button>

    <button>95<br><small>৳ 95</small></button>
    <button>100<br><small>৳ 100</small></button>

  </section>

</div>
